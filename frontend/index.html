<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Smart Logistics Agent
    </title>

    <link
        rel="stylesheet"
        href="css/main.css">

</head>

<body>
    <div class="container">
        <h1>
            Smart Logistics Agent
        </h1>

        <!-- ========================================= -->
        <!-- DASHBOARD                                 -->
        <!-- ========================================= -->

        <section class="card">

            <h2>
                Logistics Dashboard
            </h2>

            <div id="dashboard">
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div
                            id="total-shipments"
                            class="kpi-value">
                            -
                        </div>
                        <div class="kpi-label">
                            Total Shipments
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div
                            id="average-cost"
                            class="kpi-value">
                            -
                        </div>
                        <div class="kpi-label">
                            Average Cost
                        </div>
                    </div>
                </div>
                <div class="details-grid">
                    <div class="card-small">
                        <h3>
                            Countries
                        </h3>
                        <div id="countries">
                        </div>
                    </div>
                    <div class="card-small">
                        <h3>
                            Transport Modes
                        </h3>
                        <div id="transport-modes">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ========================================= -->
        <!-- CHAT                                      -->
        <!-- ========================================= -->

        <section class="card">

            <h2>
                AI Agent Chat
            </h2>

            <textarea
                id="user-message"
                placeholder="Ask a logistics question..."
            ></textarea>

            <button onclick="sendMessage()">

                Ask Agent

            </button>

        </section>

        <!-- ========================================= -->
        <!-- RESPONSE                                  -->
        <!-- ========================================= -->

        <section class="card">

            <h2>
                Agent Response
            </h2>

            <div id="response">

                No response yet.

            </div>

        </section>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
